[www]
listen = 9000
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
ping.path = /fpm-ping
ping.response = pong
; Pass container environment (DB_*, REDIS_*, …) through to PHP.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
