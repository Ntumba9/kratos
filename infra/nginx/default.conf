# KRATOS edge proxy (development).
#
# One origin for the SPA and the API so Sanctum session cookies stay
# first-party (SameSite=Lax) and no CORS is required.
#   /api/*, /sanctum/*, /up  -> KRATOS CORE (php-fpm)
#   everything else          -> KRATOS COMMAND (Vite dev server, with HMR)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kratos_command {
    server command:5173;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Matches the API's own request size limit; ingestion payloads are small.
    client_max_body_size 1m;

    # API responses carry their own security headers (SecurityHeaders
    # middleware); SPA headers are set in "location /".

    location ~ ^/(api|sanctum)/ {
        include fastcgi_params;
        fastcgi_pass core:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_pass core:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
    }

    location / {
        # Vite dev server needs inline scripts/styles and a websocket for HMR,
        # so the strict production CSP lives in infra/nginx/production.conf.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        proxy_pass http://kratos_command;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
