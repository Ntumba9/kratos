# KRATOS edge proxy (production profile).
#
# Serves the pre-built SPA (command/dist) as static files with a strict CSP
# and forwards API traffic to php-fpm. TLS termination is expected in front
# of this server (load balancer or a TLS-enabled variant of this config).

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;

    # nginx does not inherit add_header into locations that declare their
    # own, so static locations include the shared snippet explicitly. API
    # responses carry headers from the SecurityHeaders middleware.

    location ~ ^/(api|sanctum)/ {
        include fastcgi_params;
        fastcgi_pass core:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_PROXY "";
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/spa-security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/spa-security-headers.conf;
        try_files $uri /index.html;
    }
}
