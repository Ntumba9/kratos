name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: KRATOS CORE (Laravel)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser
          POSTGRES_DB: postgres
          KRATOS_DB_OWNER_PASSWORD: ci-owner
          KRATOS_DB_APP_PASSWORD: ci-app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: kratos
      DB_USERNAME: kratos_app
      DB_PASSWORD: ci-app
      DB_OWNER_USERNAME: kratos_owner
      DB_OWNER_PASSWORD: ci-owner
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Create least-privilege database roles
        working-directory: .
        env:
          PGPASSWORD: ci-superuser
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          KRATOS_DB_OWNER_PASSWORD: ci-owner
          KRATOS_DB_APP_PASSWORD: ci-app
          PGHOST: 127.0.0.1
        run: sh infra/postgres/init/01-roles.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, redis, intl, zip, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('core/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Migrate (as schema owner)
        run: php artisan migrate --database=pgsql_owner --force
      - name: Tests
        run: php artisan test
      - name: Dependency vulnerability audit
        run: composer audit --no-dev

  command:
    name: KRATOS COMMAND (React)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: command
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: command/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

  tools:
    name: Ingestion client (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (incl. signature vector shared with PHP)
        run: python -m unittest discover -s tools/kratos-send -v

  mind:
    name: KRATOS MIND (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mind
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mind/requirements*.lock
      - run: pip install -r requirements.lock -r requirements-dev.lock
      - name: Lint (ruff)
        run: ruff check kratos_mind tests && ruff format --check kratos_mind tests
      - name: Tests (rules, model, API, shared contracts)
        run: python -m pytest -p no:cacheprovider
      - name: Reproducible training (full dataset)
        run: python -m kratos_mind.training.train --seed 42 --models-dir /tmp/models

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    needs: [core, command, tools, mind]
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI environment
        run: |
          {
            echo "KRATOS_POSTGRES_SUPERUSER_PASSWORD=$(openssl rand -hex 16)"
            echo "KRATOS_DB_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "KRATOS_DB_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "KRATOS_REDIS_PASSWORD=$(openssl rand -hex 16)"
          } > .env
      - name: Start stack
        run: |
          echo "KRATOS_MIND_SHARED_SECRET=$(openssl rand -hex 32)" >> .env
          docker compose up -d --build
      - name: Wait for API and SPA
        run: |
          timeout 600 sh -c 'until curl -sf http://localhost:8080/api/v1/health >/dev/null; do sleep 5; done'
          timeout 300 sh -c 'until curl -sf http://localhost:8080/ >/dev/null; do sleep 5; done'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: CORE ⇄ MIND integration tests (real services)
        run: docker compose exec -T core php artisan test --testsuite=Integration
      - working-directory: e2e
        run: npx playwright test
      - if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            e2e/playwright-report
            e2e/test-results
            compose-logs.txt
          retention-days: 7

  docker:
    name: Production image build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/php/Dockerfile --target prod -t kratos-core:ci .
      - run: docker build -f mind/Dockerfile --target prod -t kratos-mind:ci .
