# KRATOS local development environment.
#
#   cp .env.example .env            # then set the passwords
#   docker compose up -d --build
#   open http://localhost:8080      (Mailpit: http://localhost:8025)
#
# Host ports bind to 127.0.0.1 only and avoid the default 5432/6379 so the
# stack can run alongside other local projects.

name: kratos

x-core-env: &core-env
  APP_ENV: local
  APP_URL: http://localhost:${KRATOS_HTTP_PORT:-8080}
  FRONTEND_URL: http://localhost:${KRATOS_HTTP_PORT:-8080}
  SANCTUM_STATEFUL_DOMAINS: localhost:${KRATOS_HTTP_PORT:-8080},localhost
  SESSION_DOMAIN: localhost
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: kratos
  DB_USERNAME: kratos_app
  DB_PASSWORD: ${KRATOS_DB_APP_PASSWORD:?set KRATOS_DB_APP_PASSWORD in .env}
  DB_OWNER_USERNAME: kratos_owner
  DB_OWNER_PASSWORD: ${KRATOS_DB_OWNER_PASSWORD:?set KRATOS_DB_OWNER_PASSWORD in .env}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${KRATOS_REDIS_PASSWORD:?set KRATOS_REDIS_PASSWORD in .env}
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: database
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  LOG_CHANNEL: stderr
  LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
  KRATOS_DEMO_MODE: ${KRATOS_DEMO_MODE:-false}
  MIND_URL: http://mind:8000
  MIND_SHARED_SECRET: ${KRATOS_MIND_SHARED_SECRET:?set KRATOS_MIND_SHARED_SECRET in .env}

x-core-image: &core-image
  image: kratos-core:dev
  build:
    context: .
    dockerfile: infra/docker/php/Dockerfile
    target: dev
  volumes:
    - ./core:/var/www/html
    # vendor/ lives in a named volume: faster than a Windows/macOS bind
    # mount and immune to file-sync tools touching it.
    - core_vendor:/var/www/html/vendor
    # The OpenAPI and CORE/MIND contract tests read these.
    - ./docs:/var/www/docs:ro
    - ./contracts:/var/www/contracts:ro
  environment: *core-env
  networks: [default, intelligence]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KRATOS_POSTGRES_SUPERUSER_PASSWORD:?set KRATOS_POSTGRES_SUPERUSER_PASSWORD in .env}
      POSTGRES_DB: postgres
      KRATOS_DB_OWNER_PASSWORD: ${KRATOS_DB_OWNER_PASSWORD}
      KRATOS_DB_APP_PASSWORD: ${KRATOS_DB_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${KRATOS_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kratos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${KRATOS_REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${KRATOS_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${KRATOS_REDIS_PASSWORD}

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${KRATOS_MAILPIT_PORT:-8025}:8025"

  # One-shot: install dependencies, generate APP_KEY, run migrations as the
  # schema owner, and sync the RBAC catalogue. Other services wait for it.
  core-init:
    <<: *core-image
    command: ["sh", "/var/www/html/docker/init.sh"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  core:
    <<: *core-image
    depends_on:
      core-init: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    <<: *core-image
    # SIGTERM lets the current job finish before exit (pcntl is installed).
    command: ["php", "artisan", "queue:work", "redis", "--queue=events,default,mail", "--tries=5", "--backoff=10,30,90,270", "--max-time=3600", "--sleep=1"]
    stop_grace_period: 60s
    depends_on:
      core-init: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      disable: true

  # Publishes outbox records that inline publishing could not deliver
  # (e.g. Redis was down). Safe to scale: rows are claimed with SKIP LOCKED.
  outbox-relay:
    <<: *core-image
    command: ["php", "artisan", "kratos:outbox:relay"]
    stop_grace_period: 30s
    depends_on:
      core-init: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      disable: true

  scheduler:
    <<: *core-image
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      core-init: { condition: service_completed_successfully }
    restart: unless-stopped
    healthcheck:
      disable: true

  command:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_HMR_CLIENT_PORT: ${KRATOS_HTTP_PORT:-8080}
      VITE_USE_POLLING: "true"
    volumes:
      - ./command:/app
      # Linux-native dependencies, separate from any host node_modules.
      - command_node_modules:/app/node_modules
    restart: unless-stopped

  # KRATOS MIND: internal intelligence service (ADR-0007). No published
  # port and only on the internal network, so the edge proxy cannot reach it.
  mind:
    image: kratos-mind:dev
    build:
      context: .
      dockerfile: mind/Dockerfile
      target: dev
    environment:
      MIND_SHARED_SECRET: ${KRATOS_MIND_SHARED_SECRET}
      MIND_MODELS_DIR: /srv/mind/models
      MIND_LOG_LEVEL: INFO
    volumes:
      - ./mind/kratos_mind:/srv/mind/kratos_mind:ro
      - ./mind/tests:/srv/mind/tests:ro
      - ./contracts:/srv/mind/contracts:ro
      # Code changes: `docker compose restart mind` (file events do not cross
      # Docker Desktop bind mounts, so auto-reload is not used). The model is
      # trained on first start (seeded, ~20 s) and kept across restarts.
      - mind_models:/srv/mind/models
    networks: [intelligence]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${KRATOS_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - core
      - command
    restart: unless-stopped

networks:
  default:
  # CORE, workers and MIND only; `internal` blocks outbound internet too.
  intelligence:
    internal: true

volumes:
  mind_models:
  postgres_data:
  redis_data:
  core_vendor:
  command_node_modules:
